name: actions artifact dot validation

run-name: actions artifact dot validation ${{ github.run_id }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-dot-artifact-name:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare payload files
        run: |
          set -euo pipefail
          rm -rf payload-dot payload-safe sandbox
          mkdir -p payload-dot payload-safe sandbox/inner
          printf 'dot-poc-%s\n' "$GITHUB_RUN_ID" > payload-dot/poc.txt
          printf 'safe-%s\n' "$GITHUB_RUN_ID" > payload-safe/safe.txt

      - name: Upload crafted dot artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: .
          path: payload-dot/poc.txt
          retention-days: 1

      - name: Upload second artifact to force multi-artifact mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: safe-artifact
          path: payload-safe/safe.txt
          retention-days: 1

      - name: Download all artifacts into a nested target directory
        uses: actions/download-artifact@v8.0.1
        with:
          path: sandbox/inner

      - name: Validate per artifact directory collapse
        run: |
          set -euo pipefail
          echo '--- filesystem result ---'
          find sandbox -maxdepth 4 -type f -print -exec sed -n '1p' {} \;
          echo '--- assertions ---'
          test -f sandbox/inner/poc.txt
          test -f sandbox/inner/safe-artifact/safe.txt
          if test -f sandbox/inner/./poc.txt; then
            echo 'dot artifact landed at requested root via path.join(root, ".")'
          fi
